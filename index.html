<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Body Tracking - Phase 1</title>
  </head>
  <body>
    <!-- The visible artwork: a skeleton drawn on this canvas -->
    <canvas id="stage"></canvas>

    <!-- Webcam used only as input for MediaPipe. Kept invisible. -->
    <video id="cam" autoplay muted playsinline></video>

    <!-- Debug text, toggled with the D key -->
    <pre id="debugPanel"></pre>

    <!-- Loading / error messages -->
    <div id="status"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
